name: Job Bank Watcher

on:
  # Daily — Job Bank postings change at day resolution. Runs at 16:07 UTC
  # (~9am PT / noon ET), offset from USAJOBS (:37) and Indeed (:47).
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch more pages per query (run once when setting up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: Job Bank scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape Job Bank Canada (EN+FR junior IT)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --jobbank-backfill
          else
            python scrape_jobs.py --jobbank-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          path = "output/jobbank_jobs.json"
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              job_count = int(data.get("total", 0))
          except (FileNotFoundError, json.JSONDecodeError, OSError, TypeError, ValueError):
              job_count = 0

          entry = {
              "workflow": "jobbank",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": job_count,
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/jobbank_jobs.json output/jobbank_jobs.md output/jobbank_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          git diff --cached --quiet || git commit -m "chore: update jobbank listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
